<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Session guide</title>
<!-- The page that renders a session guide. build.py fills GUIDE_DATA; the agent never reads or edits this file. -->
<style>
:root {
  color-scheme: light dark;
  --sans: Geist, Inter, system-ui, sans-serif;
  --mono: "Geist Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
  --bg: oklch(97% 0.012 260); --fg: oklch(25% 0.03 265); --muted: oklch(55% 0.03 265);
  --line: oklch(91% 0.015 265); --card: oklch(100% 0 0); --code-bg: oklch(97% 0.01 265);
  --accent: oklch(58% 0.2 265);
  --add-bg: oklch(94% 0.06 160); --add-fg: oklch(45% 0.13 160);
  --del-bg: oklch(94% 0.05 20); --del-fg: oklch(52% 0.18 20);
  --warn: oklch(60% 0.15 55); --warn-bg: oklch(95% 0.05 75);
  --ok: oklch(50% 0.13 160); --ok-bg: oklch(94% 0.06 160);
  --shadow: 0 12px 40px oklch(40% 0.05 265 / .1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(17% 0.015 265); --fg: oklch(94% 0.01 265); --muted: oklch(68% 0.02 265);
    --line: oklch(30% 0.02 265); --card: oklch(21% 0.018 265); --code-bg: oklch(15% 0.015 265);
    --accent: oklch(72% 0.16 265);
    --add-bg: oklch(32% 0.07 160 / .6); --add-fg: oklch(84% 0.14 160);
    --del-bg: oklch(32% 0.08 20 / .6); --del-fg: oklch(80% 0.14 20);
    --warn: oklch(84% 0.13 70); --warn-bg: oklch(32% 0.06 70 / .6);
    --ok: oklch(84% 0.14 160); --ok-bg: oklch(32% 0.07 160 / .6);
    --shadow: 0 12px 40px oklch(0% 0 0 / .35);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
code, pre { font: 12.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
code { background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
pre { background: var(--code-bg); padding: 12px 14px; border-radius: 8px; overflow-x: auto; margin: 10px 0; }
pre code { background: none; padding: 0; }
a { color: var(--accent); }
h1 { font-size: 22px; margin: 0 0 8px; } h2 { font-size: 16px; margin: 28px 0 8px; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.diff .add { background: var(--add-bg); color: var(--add-fg); display: block; }
.diff .del { background: var(--del-bg); color: var(--del-fg); display: block; }
.diff .ctx { display: block; }
.loc { font: 12px ui-monospace, Menlo, monospace; color: var(--accent); }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; margin-right: 4px; vertical-align: 1px; }
.one-way { background: var(--del-bg); color: var(--del-fg); } .two-way { background: var(--ok-bg); color: var(--ok); }
.agent { background: var(--warn-bg); color: var(--warn); } .user { background: var(--code-bg); color: var(--muted); }
.mermaid { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }

.shell { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
nav { border-right: 1px solid var(--line); padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--card); }
nav h4 { margin: 18px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
nav .list { font: 12.5px/1.9 ui-monospace, Menlo, monospace; white-space: pre; }
nav .list a { text-decoration: none; color: var(--fg); border-radius: 4px; padding: 1px 4px; cursor: pointer; }
nav .list a.on { background: var(--accent); color: #fff; }
nav .chg, nav .rev { color: var(--warn); }
main { padding: 24px 28px; max-width: 920px; }
.panel { display: none; } .panel.on { display: block; }
.stop { border-left: 3px solid var(--line); padding: 2px 0 2px 16px; margin: 22px 0; }
.stop.review { border-left-color: var(--warn); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 14px; }
.tabs { display: flex; gap: 6px; margin: 14px 0; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 99px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.tabs button.on { background: var(--fg); color: var(--bg); }


/* where we are: C4-style containers, touched components highlighted */
.c4 { display: grid; gap: 8px; margin: 12px 0 6px; }
.c4-row { display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; }
.c4-person { justify-self: start; border: 1px solid var(--line); border-radius: 99px; padding: 5px 14px; font-size: 13px; background: var(--card); }
.c4-box { flex: 1 1 0; min-width: 170px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 9px 11px; opacity: .55; }
.c4-box.hit { opacity: 1; border: 2px solid var(--accent); }
.c4-box.ext { border-style: dashed; }
.c4-box.db { border-radius: 10px 10px 18px 18px; }
.c4-head b { display: block; font-size: 13px; } .c4-head small { color: var(--muted); font-size: 11px; }
.c4-comps { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.c4-comp { font: 11px ui-monospace, Menlo, monospace; padding: 2px 7px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
.c4-comp.hit { background: var(--accent); border-color: var(--accent); color: #fff; }
.c4-comp[data-p] { cursor: pointer; }
.c4-link { flex: 0 0 auto; align-self: center; padding: 0 8px; font-size: 10px; color: var(--muted); text-align: center; line-height: 1.3; }
.c4-link::after { content: "⟷"; display: block; font-size: 16px; }
.c4-down { font-size: 10px; color: var(--muted); padding-left: 12px; }
@media (max-width: 700px) { .c4-row { flex-direction: column; } .c4-link::after { content: "↕"; } }

/* pseudocode first, the real hunk folded underneath */
pre.pseudo { border-left: 3px solid var(--accent); background: var(--card); border-top: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
details.hunk { margin: 6px 0 12px; } details.hunk summary { cursor: pointer; font-size: 12px; color: var(--muted); }
details.hunk[open] summary { margin-bottom: 4px; }


/* shape table: a big contract compared member by member */
.shape { margin: 10px 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.shape-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
.shape-head b { font-family: ui-monospace, Menlo, monospace; }
.shape-sum span { margin-left: 8px; font-size: 12px; }
.shape table { width: 100%; border-collapse: collapse; font: 12px ui-monospace, Menlo, monospace; }
.shape th { text-align: left; font: 600 11px -apple-system, sans-serif; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 12px; }
.shape td { padding: 5px 12px; border-top: 1px solid var(--line); vertical-align: top; }
.shape td.st { width: 1%; white-space: nowrap; text-align: center; font-family: -apple-system, sans-serif; font-size: 11px; font-weight: 600; }
.shape .t { color: var(--muted); }
.shape tr.added td.after, .shape tr.added td.st { background: var(--add-bg); color: var(--add-fg); }
.shape tr.removed td.before, .shape tr.removed td.st { background: var(--del-bg); color: var(--del-fg); }
.shape tr.changed td.st, .shape tr.changed .diffpart { background: var(--warn-bg); color: var(--warn); }
.shape tr.renamed td.st { color: var(--accent); }
.shape tr.same td { color: var(--muted); }
.shape td.note { font-family: -apple-system, sans-serif; color: var(--muted); }
.shape.hide-same tr.same { display: none; }
.shape-toggle { font-size: 12px; color: var(--accent); cursor: pointer; background: none; border: 0; padding: 0; }

/* change map: files by layer, sized by lines changed */
.map { display: grid; gap: 8px; margin: 12px 0; }
.layer { display: grid; grid-template-columns: 130px 1fr; gap: 10px; align-items: start; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.layer-name { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding-top: 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; flex-direction: column; gap: 3px; padding: 5px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font: 12px ui-monospace, Menlo, monospace; color: var(--fg); text-decoration: none; cursor: default; }
.chip[data-p] { cursor: pointer; } .chip[data-p]:hover { border-color: var(--accent); }
.chip.new { border-color: var(--add-fg); } .chip.new b::before { content: "+ "; color: var(--add-fg); }
.chip.gone { opacity: .7; } .chip.gone b::before { content: "− "; color: var(--del-fg); }
.chip.review { box-shadow: inset 3px 0 0 var(--warn); }
.chip .bar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; }
.chip .bar i { display: block; height: 100%; } .chip .bar .a { background: var(--add-fg); } .chip .bar .d { background: var(--del-fg); }
.chip .n { color: var(--muted); font-size: 11px; }
@media (max-width: 600px) { .layer { grid-template-columns: 1fr; } }

/* flow: the walkthrough as a chain of boxes, built from the nav */
.flow { margin: 12px 0 18px; }
.flow-title { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.flow-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.flow-box { padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font: 12px ui-monospace, Menlo, monospace; cursor: pointer; color: var(--fg); }
.flow-box small { display: block; color: var(--muted); font-size: 10px; }
.flow-box.chg { background: var(--add-bg); border-color: var(--add-fg); }
.flow-box.rev { border: 2px solid var(--warn); }
.flow-arrow { color: var(--muted); }

/* decision grid: door x who, built from the decision panels */
.dgrid { display: grid; grid-template-columns: 80px 1fr 1fr; gap: 6px; margin: 12px 0; font-size: 13px; }
.dgrid .h { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); align-self: end; }
.dgrid .cell { min-height: 64px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); padding: 8px; display: flex; flex-wrap: wrap; gap: 5px; align-content: flex-start; }
.dgrid .cell.hot { background: var(--warn-bg); border-color: var(--warn); }
.dgrid .cell .tag { font-size: 10px; color: var(--muted); width: 100%; }
.dgrid a { background: var(--bg); border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; cursor: pointer; color: var(--fg); text-decoration: none; }
.dgrid .rh { align-self: center; }
.dgrid a:hover { border-color: var(--accent); }

/* timeline: before/after on a date axis */
.timeline svg { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
.timeline text { font: 11px -apple-system, sans-serif; fill: var(--fg); }
.timeline .muted-t { fill: var(--muted); }
.timeline .axis { stroke: var(--line); stroke-width: 2; }
.timeline .ok { fill: var(--ok); stroke: var(--ok); } .timeline .bad { fill: var(--del-fg); stroke: var(--del-fg); }
.timeline .neutral { fill: var(--muted); stroke: var(--muted); } .timeline .now { stroke: var(--accent); stroke-dasharray: 4 3; }
.timeline .span { fill: none; stroke-width: 1.5; }
@media (max-width: 800px) { .shell { grid-template-columns: 1fr; } nav { position: static; height: auto; } main { padding: 20px 16px; } }

/* ---------- theme: Bento, large ---------- */
body {
  font: 17px/1.6 var(--sans); -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(600px 400px at 10% 0%, color-mix(in oklch, oklch(70% 0.12 300) 22%, transparent), transparent 70%),
    radial-gradient(700px 500px at 100% 30%, color-mix(in oklch, oklch(72% 0.1 200) 22%, transparent), transparent 70%),
    var(--bg);
  background-attachment: fixed;
}
code, pre { font-family: var(--mono); font-size: 13.5px; }
.shell { grid-template-columns: 330px 1fr; gap: 18px; padding: 18px; }
nav { border: 1px solid var(--line); border-radius: 22px; height: calc(100vh - 36px); top: 18px; box-shadow: var(--shadow); padding: 26px 20px; }
nav > div:first-child { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; }
nav > .muted { font-size: 13px; margin-top: 4px; }
nav h4 { font-size: 12px; margin-top: 26px; }
nav .list { font: 500 15px/2.1 var(--sans); }
nav .list a { padding: 3px 8px; border-radius: 8px; }
nav .list a.on { background: var(--fg); color: var(--bg); }
main { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 44px 52px; box-shadow: var(--shadow); max-width: none; }
h1 { font-size: 40px; font-weight: 720; letter-spacing: -0.04em; line-height: 1.1; margin-bottom: 14px; text-wrap: balance; }
h2 { display: flex; align-items: center; gap: 10px; font-size: 23px; font-weight: 680; letter-spacing: -0.025em; margin: 48px 0 14px; }
h2::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--accent); flex: none; }
main p, main li { max-width: 72ch; text-wrap: pretty; }
.small { font-size: 14.5px; }
.loc { font: 500 13px var(--mono); }
:is(.card, .layer, .shape, .c4-box, .dgrid .cell, .timeline svg, .mermaid, pre) { border-radius: 18px; border-color: var(--line); }
.layer { background: color-mix(in oklch, var(--accent) 3%, var(--card)); grid-template-columns: 150px 1fr; padding: 14px 16px; }
.chip { font: 500 14px var(--sans); padding: 8px 12px; gap: 5px; border-radius: 12px; }
.chip .n { font-size: 12px; }
.layer-name, .dgrid .h, .shape th { font-size: 12.5px; }
.flow-box { font: 500 14.5px var(--sans); padding: 10px 14px; border-radius: 12px; }
.flow-box small { font-size: 11.5px; } .flow-title { font-size: 14px; }
.c4-head b { font-size: 16px; } .c4-head small { font-size: 13px; }
.c4-comp { font: 500 13px var(--sans); padding: 3px 9px; }
.c4-box { padding: 14px 16px; } .c4-link { font-size: 12px; }
.dgrid { font-size: 15px; grid-template-columns: 100px 1fr 1fr; }
.dgrid a { padding: 5px 12px; border-radius: 12px; }
.badge { font-size: 12.5px; padding: 3px 10px; }
.card { font-size: 15.5px; padding: 16px 18px; }
.shape table { font-size: 13.5px; } .shape td { padding: 8px 14px; } .shape-head { font-size: 15px; padding: 12px 16px; }
.timeline text { font: 13px var(--sans); }
.tabs button { font-size: 14px; padding: 6px 14px; }
details.hunk summary { font-size: 14px; }
:is(.chip, .flow-box, .dgrid a) { transition: translate .15s, box-shadow .15s; }
:is(.chip[data-p], .flow-box, .dgrid a):hover { translate: 0 -2px; box-shadow: 0 6px 16px oklch(40% 0.08 265 / .15); }
/* a decision panel whose door is one-way gets a red rule above its title */
.panel:has(> .badge.one-way) h1 { border-top: 4px solid var(--del-fg); padding-top: 10px; }
/* the before/after cards stack when their own box is narrow */
.cards { container-type: inline-size; }
@container (max-width: 520px) { .card { grid-column: 1 / -1; } }
@media (max-width: 800px) { .shell { padding: 10px; gap: 10px; } nav { height: auto; } main { padding: 24px 18px; } h1 { font-size: 30px; } }


/* ---------- refactoring: lineage, where-did-it-go, changed in transit, before/after ---------- */
.lineage { margin: 14px 0; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px; overflow-x: auto; }
.lineage svg { width: 100%; min-width: 640px; height: auto; display: block; }
.lineage text { font: 13px var(--sans); fill: var(--fg); }
.lineage .col-h { font-size: 12px; font-weight: 650; fill: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.lineage .grp { font-size: 11px; fill: var(--muted); }
.lineage .node rect { fill: var(--bg); stroke: var(--line); }
.lineage .node.gone rect { fill: var(--del-bg); stroke: var(--del-fg); }
.lineage .node.new rect { fill: var(--add-bg); stroke: var(--add-fg); }
.lineage .node.review rect { stroke: var(--warn); stroke-width: 2.5; }
.lineage .node[data-p] { cursor: pointer; }
.lineage .node.gone text.mark { fill: var(--del-fg); } .lineage .node.new text.mark { fill: var(--add-fg); }
.lineage path.link { fill: none; stroke-width: 2.5; opacity: .75; }
.lineage path.link.moved, .lineage path.link.kept { stroke: var(--muted); } .lineage path.link.renamed { stroke: var(--accent); }
.lineage path.link.merged { stroke: oklch(60% 0.15 300); } .lineage path.link.split { stroke: oklch(62% 0.13 200); }
.lineage path.link.rewritten { stroke: var(--warn); }
.lineage path.link.agent { stroke-dasharray: 6 4; }
.lineage .sim { font-size: 11px; fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin: 6px 4px 0; }
.legend i { display: inline-block; width: 22px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 6px; }
.legend i.dash { border-top-style: dashed; }

table.whereto { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 15px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; margin: 12px 0; }
.whereto th { text-align: left; font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 10px 14px; background: var(--code-bg); }
.whereto td { padding: 10px 14px; border-top: 1px solid var(--line); vertical-align: top; }
.whereto td code { font-size: 12.5px; }
.how { display: inline-block; font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.how.moved { background: var(--code-bg); color: var(--muted); } .how.merged { background: color-mix(in oklch, oklch(60% 0.15 300) 14%, transparent); color: oklch(55% 0.15 300); }
.how.rewritten { background: var(--warn-bg); color: var(--warn); } .how.deleted { background: var(--del-bg); color: var(--del-fg); }
.how.derived { background: color-mix(in oklch, var(--accent) 12%, transparent); color: var(--accent); } .how.new { background: var(--add-bg); color: var(--add-fg); }

.transit { border: 1px solid var(--line); border-radius: 18px; background: var(--card); padding: 14px 16px; margin: 14px 0; }
.transit-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font: 500 14px var(--mono); }
.transit-head .arrow { color: var(--muted); font-family: var(--sans); }
.transit-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.transit-pair > div h4 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.transit-pair pre { margin: 0; font-size: 12.5px; }
.transit-pair mark { background: var(--warn-bg); color: inherit; border-radius: 3px; padding: 0 2px; }
.transit.unchanged .transit-pair { display: none; }

.ba { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.ba > div > h3 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.ba .c4-row { flex-direction: column; } .ba .c4-link::after { content: "↕"; }
@media (max-width: 900px) { .ba, .transit-pair { grid-template-columns: 1fr; } }


/* ---------- merge request: size, ship/show/ask, reading order, split plan, since last review, MR text ---------- */
.mr-strip { display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch; margin: 14px 0; }
.mr-strip > div { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; }
.mr-strip .ssa { min-width: 180px; }
.mr-strip .sizebox { flex: 1 1 380px; }
.mr-strip h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.ssa-badge { display: inline-block; font-size: 22px; font-weight: 750; letter-spacing: -0.02em; }
.ssa-badge.ship { color: var(--ok); } .ssa-badge.show { color: var(--accent); } .ssa-badge.ask { color: var(--warn); }
.size-bar { position: relative; display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--code-bg); margin: 8px 0 22px; }
.size-bar i { display: block; height: 100%; }
.size-bar .read { background: var(--accent); } .size-bar .skim { background: color-mix(in oklch, var(--accent) 35%, var(--card)); }
.size-bar .skip { background: var(--line); }
.size-budget { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--del-fg); }
.size-budget span { position: absolute; top: 20px; left: -40px; width: 80px; text-align: center; font-size: 11px; color: var(--del-fg); }
.size-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.size-legend b { color: var(--fg); }
.size-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

ol.readorder { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 8px; counter-reset: ro; }
ol.readorder li { counter-increment: ro; display: grid; grid-template-columns: 34px 64px 1fr; gap: 10px; align-items: start; max-width: none;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
ol.readorder li::before { content: counter(ro); font-weight: 700; color: var(--muted); font-size: 15px; }
ol.readorder li > div { min-width: 0; } ol.readorder li code { font-size: 12.5px; }
ol.readorder li .why { color: var(--muted); font-size: 14px; }
.tier { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 3px 0; border-radius: 99px; text-align: center; }
.tier.read { background: var(--accent); color: #fff; } .tier.skim { background: color-mix(in oklch, var(--accent) 18%, var(--card)); color: var(--accent); }
.tier.skip { background: var(--code-bg); color: var(--muted); }
ol.readorder li.skip { opacity: .7; }

.split { display: grid; gap: 0; margin: 14px 0; }
.split-mr { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 18px; position: relative; }
.split-mr + .split-mr { margin-top: 26px; }
.split-mr + .split-mr::before { content: "then"; position: absolute; top: -22px; left: 24px; font-size: 12px; color: var(--muted); }
.split-mr.warn { border-color: var(--warn); box-shadow: inset 4px 0 0 var(--warn); }
.split-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; }
.split-head h3 { margin: 0; font-size: 18px; letter-spacing: -0.02em; flex: 1 1 260px; }
.split-head .n { font: 600 13px var(--mono); color: var(--muted); }
.split-mr ul { margin: 8px 0 0; padding-left: 18px; font-size: 14.5px; }
.kind { font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; padding: 2px 9px; border-radius: 99px; }
.kind.refactor { background: var(--code-bg); color: var(--muted); } .kind.new { background: var(--add-bg); color: var(--add-fg); }
.kind.behaviour { background: var(--warn-bg); color: var(--warn); }

.since { display: grid; gap: 8px; margin: 12px 0; }
.since-row { display: grid; grid-template-columns: 90px 90px 1fr; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font-size: 14.5px; }
.since-row code { font-size: 12.5px; }
.since-st { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; text-align: center; padding: 3px 0; border-radius: 99px; }
.since-st.same { background: var(--code-bg); color: var(--muted); } .since-st.changed { background: var(--warn-bg); color: var(--warn); }
.since-st.added { background: var(--add-bg); color: var(--add-fg); } .since-st.dropped { background: var(--del-bg); color: var(--del-fg); }
.since-row.same { opacity: .65; }
.findings { display: grid; gap: 8px; margin: 12px 0; }
.finding { display: grid; grid-template-columns: 26px 1fr; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font-size: 15px; }
.finding::before { content: "✓"; color: var(--ok); font-weight: 800; }
.finding.open::before { content: "○"; color: var(--warn); }

.mrtext { position: relative; }
.mrtext pre { white-space: pre-wrap; font-size: 13px; max-height: 70vh; overflow: auto; }
.copy { position: absolute; top: 10px; right: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 10px; padding: 6px 12px; font: 600 13px var(--sans); cursor: pointer; }

/* ---------- review cards: one block per point, with its proof ---------- */
.rv-summary { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 18px; font-size: 14px; }
.rv-summary .pill { padding: 4px 12px; border-radius: 99px; font-weight: 600; background: var(--code-bg); }
.rv-summary .high { background: var(--del-bg); color: var(--del-fg); }
.rv-summary .med { background: var(--warn-bg); color: var(--warn); }
.rv-summary .ok { background: var(--ok-bg); color: var(--ok); }
.rv { --sev: var(--muted); position: relative; background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--sev);
  border-radius: 18px; padding: 18px 22px; margin: 16px 0; box-shadow: var(--shadow); }
.rv[data-sev="high"] { --sev: var(--del-fg); } .rv[data-sev="med"] { --sev: var(--warn); }
.rv[data-sev="low"] { --sev: var(--muted); } .rv[data-sev="ok"] { --sev: var(--ok); }
.rv-head { display: flex; align-items: flex-start; gap: 12px; }
.rv-head input { width: 20px; height: 20px; margin-top: 4px; accent-color: var(--accent); flex: none; cursor: pointer; }
.rv-head h3 { margin: 0; font-size: 19px; font-weight: 680; letter-spacing: -0.02em; line-height: 1.3; flex: 1; }
.rv-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0 32px; }
.rv-tag { font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; padding: 2px 9px; border-radius: 99px;
  color: var(--sev); background: color-mix(in oklch, var(--sev) 12%, transparent); }
.rv-body { margin-left: 32px; }
.rv-body > p { margin: 10px 0; }
.rv-vs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.rv-vs > div { border-radius: 14px; padding: 12px 14px; background: var(--code-bg); border: 1px solid var(--line); font-size: 14.5px; }
.rv-vs h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.rv-vs .says { border-top: 3px solid var(--accent); } .rv-vs .does { border-top: 3px solid var(--sev); }
.rv-vs pre { margin: 6px 0 0; padding: 8px 10px; font-size: 12.5px; background: var(--card); }
.rv-steps { counter-reset: st; list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 6px; }
.rv-steps li { counter-increment: st; position: relative; padding-left: 38px; min-height: 26px; font-size: 15px; max-width: none; }
.rv-steps li::before { content: counter(st); position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  font-size: 12px; font-weight: 700; background: var(--code-bg); border: 1px solid var(--line); }
.rv-steps li.bad::before { background: var(--del-bg); color: var(--del-fg); border-color: var(--del-fg); }
.rv-steps li.good::before { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.rv-ask { margin-top: 12px; padding: 10px 14px; border-radius: 14px; font-size: 15px;
  background: color-mix(in oklch, var(--accent) 8%, var(--card)); border: 1px solid color-mix(in oklch, var(--accent) 25%, var(--line)); }
.rv-ask b { color: var(--accent); }
.rv-links { margin-top: 10px; font-size: 13px; color: var(--muted); }
.rv-links a { cursor: pointer; }
.rv.done { opacity: .55; } .rv.done h3 { text-decoration: line-through; }
@media (max-width: 700px) { .rv-vs { grid-template-columns: 1fr; } .rv-body, .rv-tags { margin-left: 0; } }
</style>
</head>
<body>
<script id="guide-data" type="application/json">/*GUIDE_DATA*/</script>
<div class="shell"><nav id="nav"></nav><main id="main"></main></div>

<script>
// Renders the whole guide from the data above. build.py embeds the data; nobody edits this page by hand.
const D = JSON.parse(document.getElementById('guide-data').textContent);
const esc = v => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
// Text: `code`, **bold**, *italic*, [label](#panel); paragraphs on blank lines
const md = t => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
  .replace(/(^|[^*\w])\*([^*\s][^*]*)\*(?!\w)/g, '$1<i>$2</i>')
  .replace(/\[([^\]]+)\]\(#([\w-]+)\)/g, '<a data-p="$2">$1</a>').replace(/\n\n+/g, '</p><p>').replace(/\n/g, '<br>');
const P = t => t ? `<p>${md(t)}</p>` : '';
const line = l => `<span class="${l[0] === '+' ? 'add' : l[0] === '-' ? 'del' : 'ctx'}">${esc(l) || ' '}</span>`;
const diffText = s => `<pre class="diff"><code>${String(s).split('\n').map(line).join('')}</code></pre>`;
const hunk = ref => D.hunks?.[ref] ? `<pre class="diff"><code>${D.hunks[ref].map(([m, t]) => line(m + ' ' + t)).join('')}</code></pre>` : '';
const loc = ref => ref ? `<div class="loc">${esc(ref)}</div>` : '';
const diagram = s => s ? `<div class="mermaid">${esc(s)}</div>` : '';
const list = (xs, f) => (xs || []).map(f).join('');
const stops = D.flows.flatMap(f => f.stops);
const sevOrder = { high: 0, med: 1, low: 2, ok: 3 };
const cards = [...D.review].sort((a, b) => (sevOrder[a.sev] ?? 9) - (sevOrder[b.sev] ?? 9));
const rf = D.refactoring;
// what a link to a panel says: "stop 5 · resolveVoids", "decision 3 · …", or the panel's own name
const label = Object.fromEntries([...stops.map((s, i) => [s.id, `stop ${i + 1} · ${s.title}`]), ...D.decisions.map((d, i) => [d.id, `decision ${i + 1} · ${d.title}`])]);
document.title = D.title;

// ---------- nav ----------
const navList = items => `<div class="list">${items.join('\n')}</div>`;
const navLink = (p, label, cls = '') => `<a data-p="${esc(p)}"${cls}>${label}</a>`;
let nav = `<div>${esc(D.title)}</div><div class="muted small">${esc(D.meta)}</div>
  <h4>Overview</h4>${navList([navLink('overview', 'Context &amp; shape', ' class="on"'), navLink('contracts', `Contracts (${D.contracts.length})`),
    navLink('review', `Review this (${cards.filter(c => c.sev !== 'ok').length})`)])}`;
let n = 0;
D.flows.forEach(f => {
  nav += `<h4>Walkthrough: ${esc(f.title)}</h4>` + navList(f.stops.map(s => navLink(s.id,
    `${'  '.repeat(s.depth || 0)}${++n} ${esc(s.title)}${s.hunk ? ' <span class="chg">●</span>' : ''}${s.review ? '<span class="rev">!</span>' : ''}`)));
});
nav += `<h4>Merge request</h4>${navList([navLink('readorder', 'Read in this order'), D.split?.length ? navLink('split', 'Split plan') : '',
  D.since ? navLink('since', 'Since last review') : '', navLink('mr', 'MR description')].filter(Boolean))}`;
if (rf) nav += `<h4>Refactoring</h4>${navList([navLink('lineage', 'Lineage'), navLink('transit', `Changed in transit (${rf.transit.length})`), navLink('behaviour', 'Behaviour')])}`;
nav += `<h4>Decisions</h4>${navList(D.decisions.map((d, i) => navLink(d.id, `${i + 1} ${esc(d.title)}`)))}
  <p class="small muted" style="margin-top:14px"><span class="chg">●</span> changed &nbsp; <span class="rev">!</span> review this</p>`;
document.getElementById('nav').innerHTML = nav;

// ---------- overview ----------
const c4 = m => m ? `<div class="c4">${m.person ? `<div class="c4-person">${esc(m.person)}</div>` : ''}${list(m.rows, row =>
  `<div class="c4-row">${row.map((b, i) => `<div class="c4-box${b.hit ? ' hit' : ''}${b.kind ? ' ' + b.kind : ''}"><div class="c4-head"><b>${esc(b.name)}</b><small>${esc(b.tech)}</small></div>${
    b.comps?.length ? `<div class="c4-comps">${list(b.comps, c => `<span class="c4-comp${c.hit ? ' hit' : ''}"${c.panel ? ` data-p="${esc(c.panel)}"` : ''}>${esc(c.name)}</span>`)}</div>` : ''}</div>${
    i < row.length - 1 ? `<span class="c4-link">${esc(b.link)}</span>` : ''}`).join('')}</div>`)}</div>` : '';
const where = D.where?.before ? `<div class="ba"><div><h3>Before</h3>${c4(D.where.before)}</div><div><h3>After</h3>${c4(D.where.after)}</div></div>` : c4(D.where);
const chip = c => `<a class="chip${c.status === 'A' ? ' new' : c.status === 'D' ? ' gone' : ''}${c.review ? ' review' : ''}"${c.panel ? ` data-p="${esc(c.panel)}"` : ''} data-add="${c.add}" data-del="${c.del}"${c.path ? ` title="${esc(c.path)}"` : ''}><b>${esc(c.label)}</b>${c.files > 1 ? `<span class="n">${c.files} files</span>` : ''}</a>`;
const map = `<div class="map">${list(D.map, l => `<div class="layer"><div class="layer-name">${esc(l.layer)}</div><div class="chips">${list(l.chips, chip)}</div></div>`)}</div>`;
let k = 0;
const flowsHtml = list(D.flows, f => `<div class="flow"><div class="flow-title">Walkthrough: ${esc(f.title)}</div><div class="flow-row">${f.stops.map((s, i) =>
  `<span class="flow-box${s.hunk ? ' chg' : ''}${s.review ? ' rev' : ''}" data-p="${esc(s.id)}"><small>${s.depth ? '↳ '.repeat(s.depth).trim() : (i ? 'then' : 'entry')}</small>${++k} ${esc(s.title)}</span>`).join('<span class="flow-arrow">→</span>')}</div></div>`);
const dgrid = (() => {
  const cell = (one, agent, hot) => `<div class="cell${hot ? ' hot' : ''}">${hot ? '<span class="tag">review hardest</span>' : ''}${
    list(D.decisions.map((d, i) => ({ ...d, i })).filter(d => (d.door === 'one-way') === one && (d.by === 'agent') === agent), d => `<a data-p="${esc(d.id)}">${d.i + 1} · ${esc(d.title)}</a>`)}</div>`;
  return `<div class="dgrid"><span></span><span class="h">you decided</span><span class="h">agent default</span>
    <span class="h rh">one-way</span>${cell(true, false)}${cell(true, true, true)}<span class="h rh">two-way</span>${cell(false, false)}${cell(false, true)}</div>`;
})();
const ev = D.evidence || {};
const evidence = `${ev.timeline ? `<div class="timeline" data-rows="${esc(JSON.stringify(ev.timeline.rows))}" data-now="${esc(ev.timeline.now)}"${ev.timeline.unit ? ` data-unit="${esc(ev.timeline.unit)}"` : ''}></div>` : ''}
  ${diagram(ev.mermaid)}${ev.before || ev.after ? `<div class="cards"><div class="card"><b>Before</b><pre><code>${esc(ev.before)}</code></pre></div><div class="card"><b>After</b><pre><code>${esc(ev.after)}</code></pre></div></div>` : ''}
  ${ev.test ? `<p class="small">Pinned by <code>${esc(ev.test)}</code></p>` : ''}<p class="small">Not covered: ${md(ev.notCovered)}</p>`;
const S = D.size;
let main = `<div class="panel on" id="p-overview"><h1>${esc(D.title)}</h1>${P(D.context)}${D.outOfScope ? `<p class="small muted">Out of scope: ${md(D.outOfScope)}</p>` : ''}
  <div class="mr-strip"><div class="ssa"><h4>Ship · Show · Ask</h4><span class="ssa-badge ${esc(D.ship.call)}">${esc(D.ship.call[0].toUpperCase() + D.ship.call.slice(1))}</span><div class="small muted">${md(D.ship.why)}</div></div>
    <div class="sizebox" data-read="${S.read}" data-skim="${S.skim}" data-skip="${S.skip}" data-budget="${S.budget}"><h4>Review size</h4></div></div>
  ${where ? `<h2>Where we are</h2>${where}` : ''}
  <h2>Shape of the change</h2>${flowsHtml}${D.large ? '<p class="small muted">A large change: files are grouped per directory, and the walkthrough shows where each change is rather than its code.</p>' : ''}${map}
  ${D.callTree ? diffText(D.callTree) : ''}<details class="hunk"><summary>Every changed file</summary>${diffText(D.tree)}</details>
  <h2>Decisions at a glance</h2>${dgrid}
  <h2>Evidence</h2>${evidence}
  <h2>Merge danger</h2><p><span class="badge ${esc(D.danger.door)}">${esc(D.danger.door)} door</span> ${md(D.danger.why)} <b>Blast radius:</b> ${md(D.danger.blast)}</p>
  <h2>Sessions</h2><ul class="small">${list(D.sessions, s => `<li>${esc(s.date)}: ${md(s.text)}</li>`) || '<li>None recorded.</li>'}</ul></div>`;

// ---------- contracts and review ----------
const shape = s => s ? `<div class="shape" data-name="${esc(s.name)}" data-before="${esc(JSON.stringify(s.before))}" data-after="${esc(JSON.stringify(s.after))}"></div>` : '';
main += `<div class="panel" id="p-contracts"><h1>Contracts</h1><p class="muted small">What callers see change. Bodies are in the walkthrough.</p>
  ${list(D.contracts, c => `<div class="stop">${loc(c.at)}${P(c.who)}${c.shape ? shape(c.shape) + (c.hunk ? `<details class="hunk"><summary>The raw diff</summary>${hunk(c.hunk)}</details>` : '') : hunk(c.hunk)}</div>`) || '<p>No contract changed.</p>'}</div>`;
const card = c => `<div class="rv" id="rv-${esc(c.id)}" data-sev="${esc(c.sev)}"><div class="rv-head"><input type="checkbox" aria-label="Reviewed"><h3>${esc(c.claim)}</h3></div>
  <div class="rv-tags">${list(c.kinds, t => `<span class="rv-tag">${esc(t)}</span>`)}${c.sev === 'ok' ? '<span class="rv-tag">holds</span>' : ''}</div>
  <div class="rv-body">${P(c.why)}${c.says || c.does ? `<div class="rv-vs"><div class="says"><h4>${esc(c.says?.label)}</h4>${md(c.says?.text)}</div><div class="does"><h4>${esc(c.does?.label)}</h4>${md(c.does?.text)}</div></div>` : ''}
    ${c.steps ? `<ol class="rv-steps">${list(c.steps, s => `<li${s.mark ? ` class="${esc(s.mark)}"` : ''}>${md(s.text)}</li>`)}</ol>` : ''}
    ${c.hunk ? loc(c.hunk) + hunk(c.hunk) : ''}${c.command ? `<pre><code>${esc(c.command)}</code></pre>` : ''}
    <div class="rv-ask"><b>${c.sev === 'ok' ? 'Checked' : 'Decide'}:</b> ${md(c.ask)}</div>
    ${c.see?.length ? `<div class="rv-links">See ${c.see.map(p => `<a data-p="${esc(p)}">${esc(label[p] || p)}</a>`).join(' · ')}</div>` : ''}</div></div>`;
main += `<div class="panel" id="p-review"><h1>Review this</h1><div class="rv-summary"></div>${list(cards, card) || '<p>Nothing to review.</p>'}
  <h2>Dead ends and surprises</h2><ul>${list(D.deadEnds, d => `<li>${md(d)}</li>`) || '<li>None.</li>'}</ul></div>`;

// ---------- walkthrough stops and decisions ----------
stops.forEach((s, i) => {
  const code = `${s.pseudo ? `<pre class="pseudo diff"><code>${s.pseudo.split('\n').map(line).join('')}</code></pre>` : ''}${
    !s.hunk ? '' : !D.hunks[s.hunk] ? `<p class="small muted">The real change: <code>${esc(s.hunk)}</code></p>`
      : s.pseudo ? `<details class="hunk"><summary>The real change · ${esc(s.hunk)}</summary>${hunk(s.hunk)}</details>` : hunk(s.hunk)}${diagram(s.mermaid)}`;
  main += `<div class="panel" id="p-${esc(s.id)}">${loc(s.at)}<h1>${i + 1} · ${esc(s.title)}${s.review ? ' <span class="badge agent">review</span>' : ''}</h1>${P(s.text)}${
    s.review ? `<div class="tabs"><button class="on" data-t="diff">Diff</button><button data-t="why">Why</button><button data-t="alt">Alternatives</button></div>
      <div data-tab="diff">${code}</div><div data-tab="why" hidden>${P(s.review.why)}</div><div data-tab="alt" hidden>${P(s.review.alt)}</div>` : code}</div>`;
});
D.decisions.forEach(d => {
  main += `<div class="panel" id="p-${esc(d.id)}"><span class="badge ${esc(d.door)}">${esc(d.door)}</span>${d.by === 'agent' ? '<span class="badge agent">agent default</span>' : '<span class="badge user">you</span>'}
    <h1>${esc(d.title)}</h1><p><b>Why:</b> ${md(d.why)}</p><p><b>Alternatives:</b> ${md(d.alt)}</p>
    ${list(d.hunks, h => `<div class="stop">${loc(h.at)}${P(h.text)}${hunk(h.at)}</div>`)}</div>`;
});

// ---------- merge request ----------
main += `<div class="panel" id="p-readorder"><h1>Read in this order</h1><ol class="readorder">${list(D.readOrder, r =>
  `<li class="${esc(r.tier)}"><span class="tier ${esc(r.tier)}">${esc(r.tier)}</span><div><code>${r.files.map(esc).join('</code> <code>')}</code><div class="why">${md(r.why)}</div></div></li>`)}</ol></div>`;
const kindLabel = { refactor: 'refactoring', new: 'new code', behaviour: 'behaviour' };
if (D.split?.length) main += `<div class="panel" id="p-split"><h1>Split plan</h1><div class="split">${list(D.split, (m, i) =>
  `<div class="split-mr${m.alone ? ' warn' : ''}"><div class="split-head"><span class="n">MR ${i + 1}</span><h3>${esc(m.title)}</h3><span class="kind ${esc(m.kind)}">${kindLabel[m.kind] || esc(m.kind)}</span>
    <span class="badge ${m.call === 'ask' ? 'one-way' : 'two-way'}">${esc(m.call)}</span><span class="n">~${m.read ?? '?'} read</span></div>
    <ul>${list(m.items, x => `<li>${md(x)}</li>`)}${m.alone ? `<li><b>Does not merge alone:</b> ${md(m.alone)}</li>` : ''}</ul></div>`)}</div></div>`;
if (D.since) main += `<div class="panel" id="p-since"><h1>Since last review</h1>${D.since.unreachable ? `<p>The reviewed version <code>${esc(D.since.reviewed)}</code> is no longer reachable; compare versions in the merge request instead.</p>` :
  `<p class="small muted">Since <code>${esc(D.since.reviewed?.slice(0, 12))}</code>: ${D.since.lines} changed lines.</p><div class="since">${list(D.since.rows, r =>
    `<div class="since-row ${esc(r.st)}"><span class="since-st ${esc(r.st)}">${esc(r.st === 'same' ? 'unchanged' : r.st)}</span><code>${esc(r.sha)}</code><span>${esc(r.subject)}</span></div>`)}</div>`}
  ${D.findings?.length ? `<h2>Findings</h2><div class="findings">${list(D.findings, f => `<div class="finding${f.open ? ' open' : ''}"><span>${md(f.text)}</span></div>`)}</div>` : ''}</div>`;
main += `<div class="panel" id="p-mr"><h1>MR description</h1><p class="small muted">Also written next to this page as <code>.mr.md</code>. Paste it into the merge request.</p>
  <div class="mrtext"><button class="copy">Copy</button><pre><code>${esc(D.mrText)}</code></pre></div></div>`;

// ---------- refactoring ----------
if (rf) {
  main += `<div class="panel" id="p-lineage"><h1>Lineage</h1>${list(D.lineage, m => `${D.lineage.length > 1 ? `<h2>${esc(m.title)}</h2>` : ''}<div class="lineage" data-map="${esc(JSON.stringify(m))}"></div>`)}
    <h2>Where did it go</h2><table class="whereto"><tr><th>Responsibility</th><th>Before</th><th>After</th><th>How</th></tr>${list(rf.whereTo, w =>
      `<tr><td>${esc(w.what)}</td><td><code>${esc(w.before)}</code></td><td><code>${esc(w.after)}</code></td><td><span class="how ${esc(w.how)}">${esc(w.how)}</span></td></tr>`)}</table></div>`;
  const marked = (lines, marks) => lines.map(l => (marks || []).reduce((h, m) => h.split(esc(m)).join(`<mark>${esc(m)}</mark>`), esc(l))).join('\n');
  main += `<div class="panel" id="p-transit"><h1>Changed in transit</h1>${list(rf.transit, t =>
    `<div class="transit${t.unchanged ? ' unchanged' : ''}"><div class="transit-head"><span>${esc(t.from)}</span><span class="arrow">→</span><span>${esc(t.to)}</span><span class="how ${t.unchanged ? 'moved' : 'rewritten'}">${t.unchanged ? 'as-is' : 'changed'}</span></div>
      ${P(t.text)}<div class="transit-pair"><div><h4>before</h4><pre><code>${marked(D.code.base[t.from] || [], t.mark)}</code></pre></div><div><h4>after</h4><pre><code>${marked(D.code.now[t.to] || [], t.mark)}</code></pre></div></div></div>`) || '<p>Nothing moved.</p>'}</div>`;
  main += `<div class="panel" id="p-behaviour"><h1>Behaviour</h1><table class="whereto"><tr><th>Behaviour</th><th>Before</th><th>After</th><th>Status</th></tr>${list(rf.behaviour, b =>
    `<tr><td>${esc(b.what)}</td><td>${esc(b.before)}</td><td>${esc(b.after)}</td><td><span class="how ${b.status === 'unchanged' ? 'moved' : b.status === 'dropped' ? 'deleted' : 'rewritten'}">${esc(b.status)}</span></td></tr>`)}</table>
    ${rf.tests ? shape({ name: 'Tests', ...rf.tests }) : ''}</div>`;
}
document.getElementById('main').innerHTML = main;

// ---------- components ----------
// shape table: before / after are lists of [name, type, note] or {name, type, was, note}; matched by name, or by "was"
document.querySelectorAll('.shape[data-after]').forEach(el => {
  const norm = m => Array.isArray(m) ? { name: m[0], type: m[1], note: m[2] } : m;
  const before = JSON.parse(el.dataset.before || '[]').map(norm), after = JSON.parse(el.dataset.after).map(norm);
  const used = new Set(), rows = [];
  after.forEach(a => {
    const b = before.find(x => x.name === (a.was ?? a.name));
    if (b) used.add(b);
    const kind = !b ? 'added' : a.was && a.was !== a.name ? 'renamed' : (b.type ?? '') !== (a.type ?? '') ? 'changed' : 'same';
    rows.push({ kind, b, a, note: a.note ?? b?.note });
  });
  before.filter(b => !used.has(b)).forEach(b => rows.push({ kind: 'removed', b, note: b.note }));
  const label = { added: '+ added', removed: '− removed', changed: '~ type', renamed: '→ renamed', same: '=' };
  const cell = m => m ? `${esc(m.name)}${m.type ? ` <span class="t">${esc(m.type)}</span>` : ''}` : '';
  const count = k => rows.filter(r => r.kind === k).length;
  const sum = ['added', 'changed', 'renamed', 'removed'].filter(count).map(k => `<span>${label[k]} ${count(k)}</span>`).join('') + (count('same') ? `<span class="muted">= ${count('same')}</span>` : '');
  el.classList.add('hide-same');
  el.innerHTML = `<div class="shape-head"><b>${esc(el.dataset.name)}</b><span class="shape-sum">${sum}${count('same') ? ' <button class="shape-toggle">show unchanged</button>' : ''}</span></div>
    <table><tr><th>before</th><th></th><th>after</th><th></th></tr>${rows.map(r =>
      `<tr class="${r.kind}"><td class="before">${cell(r.b)}</td><td class="st">${label[r.kind]}</td><td class="after">${cell(r.a)}</td><td class="note">${esc(r.note)}</td></tr>`).join('')}</table>`;
  const tg = el.querySelector('.shape-toggle');
  if (tg) tg.onclick = () => { el.classList.toggle('hide-same'); tg.textContent = el.classList.contains('hide-same') ? 'show unchanged' : 'hide unchanged'; };
});

// review cards: summary line, and ticks remembered in this browser only
(() => {
  const els = [...document.querySelectorAll('.rv')];
  const key = id => `guide:${location.pathname}:${id}`;
  const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                  set: (k, v) => { try { v ? localStorage.setItem(k, '1') : localStorage.removeItem(k); } catch {} } };
  const summary = () => {
    const n = sev => els.filter(c => c.dataset.sev === sev).length;
    const done = els.filter(c => c.classList.contains('done')).length;
    document.querySelectorAll('.rv-summary').forEach(el => el.innerHTML =
      [['high', 'high'], ['med', 'medium'], ['low', 'low'], ['ok', 'checked, holds']].filter(([s]) => n(s))
        .map(([s, l]) => `<span class="pill ${s}">${n(s)} ${l}</span>`).join('') + `<span class="muted">${done} of ${els.length} reviewed</span>`);
  };
  els.forEach(c => {
    const box = c.querySelector('.rv-head input');
    box.checked = !!store.get(key(c.id));
    c.classList.toggle('done', box.checked);
    box.onchange = () => { c.classList.toggle('done', box.checked); store.set(key(c.id), box.checked); summary(); };
  });
  if (els.length) summary();
})();

// lineage map: old files left, new right; nodes {id, name, dir, panel?, review?, note?}, links {from, to, kind, sim?, by, note?}
document.querySelectorAll('.lineage[data-map]').forEach(el => {
  const { old: olds, new: news, links } = JSON.parse(el.dataset.map);
  const linkedOld = new Set(links.flatMap(l => l.from)), linkedNew = new Set(links.flatMap(l => l.to));
  // order the new column by the average position of its sources, so lines cross as little as possible
  const oi = Object.fromEntries(olds.map((o, i) => [o.id, i]));
  const weight = id => { const src = links.filter(l => l.to.includes(id)).flatMap(l => l.from).map(f => oi[f]).filter(x => x !== undefined);
    return src.length ? src.reduce((a, b) => a + b, 0) / src.length : olds.length + 1; };
  const ordered = [...news].sort((a, b) => weight(a.id) - weight(b.id));
  const W = 960, NW = 330, NH = 34, GAP = 8, TOP = 34, LX = 0, RX = W - NW;
  const y = i => TOP + i * (NH + GAP);
  const pos = {}; olds.forEach((o, i) => pos['o:' + o.id] = y(i)); ordered.forEach((o, i) => pos['n:' + o.id] = y(i));
  const H = TOP + Math.max(olds.length, ordered.length) * (NH + GAP) + 10;
  const node = (o, x, side, cls, mark) => `<g class="node ${cls}${o.review ? ' review' : ''}"${o.panel ? ` data-p="${esc(o.panel)}"` : ''}><title>${esc(o.note || o.id)}</title>
    <rect x="${x}" y="${pos[side + o.id]}" width="${NW}" height="${NH}" rx="9"/>
    ${o.dir ? `<text class="grp" x="${x + 10}" y="${pos[side + o.id] + 13}">${esc(o.dir)}</text>` : ''}
    <text x="${x + 10}" y="${pos[side + o.id] + (o.dir ? 27 : 22)}">${esc(o.name)}</text>
    ${mark ? `<text class="mark" x="${x + NW - 10}" y="${pos[side + o.id] + 22}" text-anchor="end" font-weight="700">${mark}</text>` : ''}</g>`;
  let svg = `<text class="col-h" x="${LX}" y="18">before</text><text class="col-h" x="${RX}" y="18">after</text>`;
  links.forEach(l => l.from.forEach(f => l.to.forEach(t => {
    if (pos['o:' + f] === undefined || pos['n:' + t] === undefined) return;
    const y1 = pos['o:' + f] + NH / 2, y2 = pos['n:' + t] + NH / 2, x1 = LX + NW, x2 = RX, mx = (x1 + x2) / 2;
    svg += `<path class="link ${esc(l.kind)} ${l.by === 'agent' ? 'agent' : ''}" d="M${x1} ${y1} C${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}"><title>${esc(l.kind + (l.sim ? ` · ${l.sim}% similar` : '') + (l.by === 'agent' ? ' · stated by the session, git sees no link' : ' · detected by git') + (l.note ? `: ${l.note}` : ''))}</title></path>`;
    if (l.sim && l.from.length === 1 && l.to.length === 1) svg += `<text class="sim" x="${mx}" y="${(y1 + y2) / 2 - 4}" text-anchor="middle">${l.sim}%</text>`;
  })));
  olds.forEach(o => svg += node(o, LX, 'o:', linkedOld.has(o.id) ? '' : 'gone', linkedOld.has(o.id) ? '' : '✕'));
  ordered.forEach(o => svg += node(o, RX, 'n:', linkedNew.has(o.id) ? '' : 'new', linkedNew.has(o.id) ? '' : '+'));
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Lineage: where each old file went">${svg}</svg>
    <div class="legend"><span><i style="border-color:var(--muted)"></i>kept / moved</span><span><i style="border-color:var(--accent)"></i>renamed</span>
    <span><i style="border-color:oklch(60% 0.15 300)"></i>merged</span><span><i style="border-color:oklch(62% 0.13 200)"></i>split</span>
    <span><i style="border-color:var(--warn)"></i>rewritten</span><span><i class="dash" style="border-color:var(--muted)"></i>stated by the session; git sees no link</span>
    <span>✕ deleted, no successor</span><span>+ new, no predecessor</span></div>`;
});

// review size: read / skim / skip lines against the budget
document.querySelectorAll('.sizebox[data-read]').forEach(el => {
  const r = +el.dataset.read, k = +el.dataset.skim, p = +el.dataset.skip, b = +(el.dataset.budget || 400), total = r + k + p;
  const scale = Math.max(total, b * 1.1), pct = v => (v / scale * 100).toFixed(2) + '%';
  el.insertAdjacentHTML('beforeend', `<div class="size-bar"><i class="read" style="width:${pct(r)}"></i><i class="skim" style="width:${pct(k)}"></i><i class="skip" style="width:${pct(p)}"></i>
    <span class="size-budget" style="left:${pct(b)}"><span>budget ${b}</span></span></div>
    <div class="size-legend"><span><i style="background:var(--accent)"></i><b>${r.toLocaleString()}</b> to read</span><span><i style="background:color-mix(in oklch, var(--accent) 35%, var(--card))"></i><b>${k.toLocaleString()}</b> to skim</span><span><i style="background:var(--line)"></i><b>${p.toLocaleString()}</b> to skip</span><span>· ${r > b ? `<b style="color:var(--del-fg)">${Math.round(r / b * 10) / 10}× the budget</b>${D.split?.length ? ', see the <a data-p="split">split plan</a>' : ''}` : 'within budget'}</span></div>`);
});
// MR text: copy button
document.querySelectorAll('.mrtext').forEach(el => {
  const btn = el.querySelector('.copy');
  btn.onclick = async () => { try { await navigator.clipboard.writeText(D.mrText); btn.textContent = 'Copied'; } catch { btn.textContent = 'Select and copy'; } setTimeout(() => btn.textContent = 'Copy', 1500); };
});
// change map: +/- bars scaled to the largest chip
(() => {
  const chips = [...document.querySelectorAll('.chip[data-add]')];
  const max = Math.max(1, ...chips.map(c => +c.dataset.add + +c.dataset.del));
  chips.forEach(c => {
    const a = +c.dataset.add, d = +c.dataset.del;
    c.insertAdjacentHTML('beforeend', `<span class="bar" style="width:${Math.max(6, (a + d) / max * 90)}px"><i class="a" style="flex:${a}"></i><i class="d" style="flex:${d}"></i></span><span class="n">+${a} −${d}</span>`);
  });
})();
// timeline: rows of events and spans on one shared axis; dates (YYYY-MM-DD), or plain numbers with data-unit (e.g. "s")
document.querySelectorAll('.timeline[data-rows]').forEach(el => {
  const rows = JSON.parse(el.dataset.rows), unit = el.dataset.unit, nowAt = el.dataset.now;
  const val = v => unit ? +v : new Date(v + 'T00:00:00Z').getTime();
  const fmt = v => unit ? `${v}${unit}` : new Date(v + 'T00:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
  const at = e => e.at ?? e.date;
  const all = rows.flatMap(r => [...r.events.map(e => val(at(e))), ...(r.spans || []).flatMap(s => [val(s.from), val(s.to)])]);
  const lo = Math.min(...all), hi = Math.max(...all), W = 720, L = 110, R = 40, H = 78;
  const x = v => L + (val(v) - lo) / Math.max(1, hi - lo) * (W - L - R);
  let svg = '';
  rows.forEach((r, i) => {
    const y = 40 + i * H;
    svg += `<text x="10" y="${y + 4}" font-weight="600">${esc(r.label)}</text><line class="axis" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/>`;
    (r.spans || []).forEach(s => {
      const a = x(s.from), b = x(s.to), t = s.tone || 'neutral';
      svg += `<path class="span ${esc(t)}" d="M${a} ${y + 12} v6 H${b} v-6"/><text class="muted-t" x="${(a + b) / 2}" y="${y + 32}" text-anchor="middle">${esc(s.text)}</text>`;
    });
    r.events.forEach((e, j) => {
      const cx = x(at(e)), t = e.tone || 'neutral', up = j % 2 === 0 ? -12 : -24;
      svg += `<circle class="${esc(t)}" cx="${cx}" cy="${y}" r="5"/><text x="${cx}" y="${y + up}" text-anchor="middle">${esc(e.text)} <tspan class="muted-t">${fmt(at(e))}</tspan></text>`;
    });
  });
  if (nowAt) svg += `<line class="now" x1="${x(nowAt)}" x2="${x(nowAt)}" y1="14" y2="${rows.length * H + 10}"/><text x="${x(nowAt) + 4}" y="12" class="muted-t">today</text>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${rows.length * H + 20}" role="img">${svg}</svg>`;
});

// ---------- navigation ----------
function show(p) {
  if (!document.getElementById('p-' + p)) return;
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.p === p));
  document.querySelectorAll('.panel').forEach(x => x.classList.toggle('on', x.id === 'p-' + p));
  history.replaceState(null, '', '#' + p);
  window.scrollTo(0, 0);
  drawDiagrams();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-p]');
  if (t) show(t.dataset.p);
});
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  const panel = b.closest('.panel');
  panel.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  panel.querySelectorAll('[data-tab]').forEach(t => t.hidden = t.dataset.tab !== b.dataset.t);
});
const fromHash = () => { const p = location.hash.slice(1); if (p) show(p); };
addEventListener('hashchange', fromHash);
fromHash();
// Mermaid measures nothing inside a hidden panel, so each diagram is drawn when its panel opens.
function drawDiagrams() {
  if (!window.mermaid) return;
  if (!drawDiagrams.ready) {
    mermaid.initialize({ startOnLoad: false, theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'neutral' });
    drawDiagrams.ready = true;
  }
  const nodes = [...document.querySelectorAll('.panel.on .mermaid:not([data-processed])')];
  if (nodes.length) mermaid.run({ nodes });
}
drawDiagrams();
</script>
<!-- Loaded last and in the background, so the guide renders even when the CDN is slow or offline. -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js" defer onload="drawDiagrams()"></script>
</body>
</html>
