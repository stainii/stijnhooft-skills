name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  session-guide:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # a file opened without an explicit encoding fails here too, not only on Windows
      - run: python -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s tests/session-guide -v
